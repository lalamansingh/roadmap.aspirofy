<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      try {
        var t = localStorage.getItem('aspirofy-theme')
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <div id="root"></div>
